name: EAS Build — Android AAB (with inputs)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      web_app_url:
        description: 'Web app ZIP URL (must be downloadable). Example: https://.../app.zip'
        required: true
      app_name:
        description: 'App display name (expo.name)'
        required: true
        default: 'My App'
      application_id:
        description: 'Android package id (com.example.myapp)'
        required: true
        default: 'com.example.myapp'
      version_name:
        description: 'App version (expo.version) e.g. 1.0.0'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Android versionCode (integer)'
        required: false
        default: '1'
      icon_url:
        description: 'App icon URL (1024x1024 PNG) optional'
        required: false
        default: ''
      splash_image_url:
        description: 'Splash image URL (1242x2436 PNG) optional'
        required: false
        default: ''

env:
  # If your Expo project is in a subfolder, set this to that folder name (e.g. "expo-app")
  PROJECT_PATH: '.'
  UPLOAD_TO_S3: 'false' # change to "true" if you want S3 upload enabled

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_PATH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache npm
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          # use package-lock.json hash for a stable, reliable cache key
          key: node-modules-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-
        continue-on-error: true

      - name: Setup Expo
        uses: expo/expo-github-action@v7
        with:
          packager: 'npm'
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: |
          npm ci

      - name: Ensure EAS project is initialized
        run: npx eas-cli@latest init --non-interactive --force

      - name: Download and validate web app, then patch app.json
        run: |
          set -e
          # target project dir (keep default project root)
          PROJECT_DIR="${{ env.PROJECT_PATH || '.' }}"
          # read inputs passed to the workflow
          WEB_URL="${{ github.event.inputs.web_app_url || '' }}"
          APP_NAME="${{ github.event.inputs.app_name || '' }}"
          APPLICATION_ID="${{ github.event.inputs.application_id || '' }}"
          VERSION_NAME="${{ github.event.inputs.version_name || '' }}"
          VERSION_CODE="${{ github.event.inputs.version_code || '' }}"
          ICON_URL="${{ github.event.inputs.icon_url || '' }}"
          SPLASH_URL="${{ github.event.inputs.splash_image_url || '' }}"

          if [ -n "$WEB_URL" ]; then
            echo "Downloading web app from $WEB_URL"
            tmpzip="/tmp/webapp-$$.zip"
            unzip_dir="/tmp/webapp-$$"
            curl -fsSL "$WEB_URL" -o "$tmpzip" || { echo "download failed"; exit 0; }
            #-- robust zip check --
            if ! file "$tmpzip" | grep -q "Zip archive data"; then
                echo "ERROR: The file downloaded from $WEB_URL is not a valid ZIP archive."
                echo "Please ensure the URL points directly to a ZIP file."
                file "$tmpzip" # print file type for debugging
                exit 1
            fi
            mkdir -p "$unzip_dir"
            unzip -q "$tmpzip" -d "$unzip_dir" || true

            # --- DEBUGGING: Show the unzipped file structure ---
            echo "--- Unzipped content in $unzip_dir ---"
            ls -laR "$unzip_dir"
            echo "-------------------------------------------"

            # --- Robustly find the source directory for rsync ---
            # Handle zip files that have a single root directory
            src_dir="$unzip_dir"
            # Count number of items in the unzip_dir
            item_count=$(find "$unzip_dir" -mindepth 1 -maxdepth 1 | wc -l)
            if [ "$item_count" -eq 1 ]; then
              # If there's only one item, it's likely a container directory
              # Use that directory as the source for rsync
              nested_dir=$(find "$unzip_dir" -mindepth 1 -maxdepth 1 -type d)
              if [ -n "$nested_dir" ]; then
                  echo "Detected nested directory: $nested_dir. Using it as source."
                  src_dir="$nested_dir"
              fi
            fi

            # copy contents into project dir but do not overwrite .git
            echo "Syncing from $src_dir/ to $PROJECT_DIR/"
            rsync -a --exclude='.git' "$src_dir"/ "$PROJECT_DIR/"
            echo "Copied web app into $PROJECT_DIR"

            # --- DEBUGGING: Show final structure in project dir ---
            echo "--- Final content in $PROJECT_DIR ---"
            ls -la "$PROJECT_DIR"
            echo "----------------------------------------"

          else
            echo "No WEB_URL provided, skipping download"
          fi
          echo "File is a valid ZIP archive."

          # Unzip and copy into project dir
          tmpdir_unzip="/tmp/webapp-unzipped"
          mkdir -p "$tmpdir_unzip"
          unzip -q "$tmpzip" -d "$tmpdir_unzip"
          rsync -a --exclude='.git' "$tmpdir_unzip/" "$PROJECT_DIR/"
          echo "Successfully copied web app into '$PROJECT_DIR'"

          # Patch app.json using the python script
          export APP_JSON_PATH="$PROJECT_DIR/app.json"
          if [ ! -f "$APP_JSON_PATH" ]; then
            echo "{}" > "$APP_JSON_PATH"
          fi
          python3 .github/scripts/patch-app-json.py

      - name: Run EAS builds for AAB and APK
        run: |
          set -ex
          echo "INFO: Starting AAB build..."
          npx eas-cli@latest build --platform android --profile production --non-interactive --json > build-aab-output.json
          cat build-aab-output.json

          echo "INFO: Starting APK build..."
          npx eas-cli@latest build --platform android --profile production-apk --non-interactive --json > build-apk-output.json
          cat build-apk-output.json

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Download AAB and APK from EAS
        id: download_artifacts
        run: |
          set -ex
          AAB_URL=$(jq -r '.[0].artifacts.buildUrl' build-aab-output.json)
          APK_URL=$(jq -r '.[0].artifacts.buildUrl' build-apk-output.json)

          if [ -z "$AAB_URL" ] || [ "$AAB_URL" == "null" ]; then
            echo "::error::Could not find AAB artifact URL in build output."
            exit 1
          fi
          if [ -z "$APK_URL" ] || [ "$APK_URL" == "null" ]; then
            echo "::error::Could not find APK artifact URL in build output."
            exit 1
          fi

          echo "Downloading AAB from $AAB_URL"
          curl -fLo application.aab "$AAB_URL"
          echo "AAB downloaded successfully."

          echo "Downloading APK from $APK_URL"
          curl -fLo application.apk "$APK_URL"
          echo "APK downloaded successfully."

      - name: Upload AAB and APK as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build-artifacts
          path: |
            application.aab
            application.apk
