name: EAS Build — Android AAB (with inputs)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      web_app_url:
        description: 'Web app URL (optional)'
        required: false
        default: ''
      app_name:
        description: 'App display name (expo.name)'
        required: true
        default: 'My App'
      application_id:
        description: 'Android package id (com.example.myapp)'
        required: true
        default: 'com.example.myapp'
      version_name:
        description: 'App version (expo.version) e.g. 1.0.0'
        required: true
        default: '1.0.0'
      versionCode:
        description: 'Android version code (integer)'
        required: false
        default: ''
      icon_url:
        description: 'App icon URL (1024x1024 PNG)'
        required: false
        default: ''
      splash_image_url:
        description: 'Splash screen image URL (1242x2436 PNG)'
        required: false
        default: ''

env:
  # If your Expo project is in a subfolder, set this to that folder name (e.g. "expo-app")
  PROJECT_PATH: '.'
  UPLOAD_TO_S3: 'false' # change to "true" if you want S3 upload enabled

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_PATH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache npm
        id: cache-npm
        uses: actions/cache@v4
        with:
          # use package-lock.json hash for a stable, reliable cache key
          path: ~/.npm
          key: node-modules-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-
        continue-on-error: true   # cache service errors shouldn't fail the build

      - name: Setup Expo
        uses: expo/expo-github-action@v7
        with:
          packager: 'npm'
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: |
          npm ci

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Verify app.json exists
        run: |
          if [ ! -f "app.json" ]; then
            echo "app.json not found in the project root."
            echo "If you use app.config.js or a custom config, please mention this in the PR and stop."
            exit 1
          fi

      - name: Patch app.json with inputs
        run: |
          node -e "
          const fs = require('fs');
          const path = 'app.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          const expoRoot = config.expo ? config.expo : config;

          expoRoot.name = process.env.APP_NAME || expoRoot.name;
          expoRoot.version = process.env.VERSION_NAME || expoRoot.version;

          if (!expoRoot.android) expoRoot.android = {};
          expoRoot.android.package = process.env.APPLICATION_ID || expoRoot.android.package;

          if (process.env.ICON_URL) {
            expoRoot.icon = process.env.ICON_URL;
          }
          if (process.env.SPLASH_IMAGE_URL) {
            if (!expoRoot.splash) expoRoot.splash = {};
            expoRoot.splash.image = process.env.SPLASH_IMAGE_URL;
          }

          const output = config.expo ? { ...config, expo: expoRoot } : expoRoot;
          fs.writeFileSync(path, JSON.stringify(output, null, 2));
          console.log('Patched app.json successfully.');
          "
        env:
          APP_NAME: ${{ github.event.inputs.app_name }}
          VERSION_NAME: ${{ github.event.inputs.version_name }}
          APPLICATION_ID: ${{ github.event.inputs.application_id }}
          ICON_URL: ${{ github.event.inputs.icon_url }}
          SPLASH_IMAGE_URL: ${{ github.event.inputs.splash_image_url }}

      - name: Patch app.json with versionCode (if provided)
        if: ${{ github.event.inputs.versionCode != '' }}
        run: |
          node -e "
          const fs=require('fs');
          const p='app.json';
          if(!fs.existsSync(p)){ console.log('app.json not found'); process.exit(0); }
          const cfg=JSON.parse(fs.readFileSync(p,'utf8'));
          cfg.expo = cfg.expo || {};
          cfg.expo.android = cfg.expo.android || {};
          cfg.expo.android.versionCode = parseInt(process.env.VERSION_CODE,10);
          fs.writeFileSync(p, JSON.stringify(cfg,null,2));
          console.log('Patched app.json.versionCode=', process.env.VERSION_CODE);
          "
        env:
          VERSION_CODE: ${{ github.event.inputs.versionCode }}

      - name: Show patched app.json (for debug)
        run: |
          echo "---- Patched app.json ----"
          cat app.json || true
          echo "--------------------------"

      - name: Install eas-cli (global fallback)
        run: |
          npm install -g eas-cli@^3.0.0 || true

      - name: Login to Expo (non-interactive)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          # login so eas commands can run
          echo "$EXPO_TOKEN" | eas login --token

      - name: Ensure EAS project is initialized (non-interactive)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          # Initialize / link the project to EAS in non-interactive mode.
          # This registers the project on Expo servers and writes projectId locally so `eas build` works in CI.
          # If the project is already linked, this command returns success and is safe to run.
          eas init --non-interactive || true

      - name: Show eas.json (debug)
        run: |
          echo "------ eas.json ------"
          cat eas.json || true
          echo "----------------------"

      - name: Run EAS build (android app-bundle)
        run: |
          npx eas build --platform android --profile production --non-interactive

      - name: (Optional) Upload build artifact to S3 (non-fatal)
        if: env.UPLOAD_TO_S3 == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          set -e
          # find the artifact URL (best-effort). If any step fails, do not fail the whole job.
          set +e
          BUILD_ID=$(eas build:list --platform android --limit 1 --status finished --json | jq -r '.[0].id')
          ARTIFACT_URL=$(eas build:view $BUILD_ID --json | jq -r '.artifacts.buildUrl // empty')
          if [ -z "$ARTIFACT_URL" ]; then
            echo "No artifact URL found; skipping S3 upload."
            exit 0
          fi
          curl -L -H "Authorization: Bearer $EXPO_TOKEN" -o app.aab "$ARTIFACT_URL"
          if [ ! -f app.aab ]; then
            echo "Download failed; skipping S3 upload."
            exit 0
          fi
          aws s3 cp app.aab "s3://$S3_BUCKET/expo-artifacts/$GITHUB_RUN_ID-app.aab" || echo "S3 upload failed but not failing job."
        continue-on-error: true
