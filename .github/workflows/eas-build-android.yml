name: EAS Build — Android AAB (with inputs)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      web_app_url:
        description: 'Web app URL (optional)'
        required: false
        default: ''
      app_name:
        description: 'App display name (expo.name)'
        required: true
        default: 'My App'
      application_id:
        description: 'Android package id (com.example.myapp)'
        required: true
        default: 'com.example.myapp'
      version_name:
        description: 'App version (expo.version) e.g. 1.0.0'
        required: true
        default: '1.0.0'
      icon_url:
        description: 'App icon URL (1024x1024 PNG)'
        required: false
        default: ''
      splash_image_url:
        description: 'Splash screen image URL (1242x2436 PNG)'
        required: false
        default: ''

env:
  # If your Expo project is in a subfolder, set this to that folder name (e.g. "expo-app")
  PROJECT_PATH: '.'
  UPLOAD_TO_S3: 'false' # change to "true" if you want S3 upload enabled

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_PATH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: |
          npm ci || (npm install --legacy-peer-deps && echo "npm ci failed, fell back to npm install")

      - name: Ensure EAS project is initialized
        run: npx eas-cli@latest init --non-interactive --force

      - name: Run EAS build
        run: npx eas-cli@latest build --platform android --profile production --non-interactive

      - name: (Optional) Download build artifact & Upload to S3
        if: env.UPLOAD_TO_S3 == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          set -e
          BUILD_ID=$(npx eas-cli@latest build:list --platform android --limit 1 --status finished --json | jq -r '.[0].id')
          if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" == "null" ]; then
            echo "No finished builds found."
            exit 1
          fi
          echo "Found build id: $BUILD_ID"
          ARTIFACT_URL=$(npx eas-cli@latest build:view $BUILD_ID --json | jq -r '.artifacts.buildUrl')
          if [ -z "$ARTIFACT_URL" ] || [ "$ARTIFACT_URL" == "null" ]; then
            echo "No artifact url found for build $BUILD_ID"
            exit 1
          fi
          echo "Artifact URL: $ARTIFACT_URL"
          curl -L -H "Authorization: Bearer $EXPO_TOKEN" -o app.aab "$ARTIFACT_URL"
          aws configure set region "$AWS_REGION"
          aws s3 cp app.aab "s3://$S3_BUCKET/expo-artifacts/app-${{ github.run_id }}-${{ github.run_number }}.aab" --acl public-read
          echo "Uploaded to: https://$S3_BUCKET.s3.$AWS_REGION.amazonaws.com/expo-artifacts/app-${{ github.run_id }}-${{ github.run_number }}.aab"
