name: EAS Build — Android AAB (with inputs)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      web_app_url:
        description: 'Web app ZIP URL (must be downloadable). Example: https://.../app.zip'
        required: true
      app_name:
        description: 'App display name (expo.name)'
        required: true
        default: 'My App'
      application_id:
        description: 'Android package id (com.example.myapp)'
        required: true
        default: 'com.example.myapp'
      version_name:
        description: 'App version (expo.version) e.g. 1.0.0'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Android versionCode (integer)'
        required: false
        default: '1'
      icon_url:
        description: 'App icon URL (1024x1024 PNG) optional'
        required: false
        default: ''
      splash_image_url:
        description: 'Splash image URL (1242x2436 PNG) optional'
        required: false
        default: ''

env:
  # If your Expo project is in a subfolder, set this to that folder name (e.g. "expo-app")
  PROJECT_PATH: '.'
  UPLOAD_TO_S3: 'false' # change to "true" if you want S3 upload enabled

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_PATH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache npm
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          # use package-lock.json hash for a stable, reliable cache key
          key: node-modules-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-
        continue-on-error: true

      - name: Setup Expo
        uses: expo/expo-github-action@v7
        with:
          packager: 'npm'
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: |
          npm ci

      - name: Ensure EAS project is initialized
        run: npx eas-cli@latest init --non-interactive --force

      - name: Download web app (if provided) and patch app.json
        run: |
          set -e
          # target project dir (keep default project root)
          export PROJECT_DIR="${PROJECT_PATH:-.}"
          # read inputs passed to the workflow
          export WEB_URL="${{ github.event.inputs.web_app_url || '' }}"
          export APP_NAME="${{ github.event.inputs.app_name || '' }}"
          export APPLICATION_ID="${{ github.event.inputs.application_id || '' }}"
          export VERSION_NAME="${{ github.event.inputs.version_name || '' }}"
          export VERSION_CODE="${{ github.event.inputs.version_code || '' }}"
          export ICON_URL="${{ github.event.inputs.icon_url || '' }}"
          export SPLASH_URL="${{ github.event.inputs.splash_image_url || '' }}"

          if [ -n "$WEB_URL" ]; then
            echo "Downloading web app from $WEB_URL"
            tmpzip="/tmp/webapp-$$.zip"
            curl -fsSL "$WEB_URL" -o "$tmpzip" || { echo "ERROR: Download failed from URL: $WEB_URL"; exit 1; }
            mkdir -p /tmp/webapp-$$
            unzip -q "$tmpzip" -d /tmp/webapp-$$ || { echo "ERROR: Failed to unzip the downloaded file. It may not be a valid ZIP archive."; exit 1; }
            # copy contents into project dir but do not overwrite .git
            rsync -a --exclude='.git' /tmp/webapp-$$/ "$PROJECT_DIR/"
            echo "Copied web app into $PROJECT_DIR"
          else
            echo "ERROR: web_app_url is required but was not provided."
            exit 1
          fi

          # patch/create app.json
          export APP_JSON_PATH="$PROJECT_DIR/app.json"
          if [ ! -f "$APP_JSON_PATH" ]; then
            echo "{}" > "$APP_JSON_PATH"
          fi

          python3 - <<'PY2'
          import json,sys,os
          p=os.environ['APP_JSON_PATH']
          with open(p,'r') as f:
            try:
              cfg=json.load(f)
            except:
              cfg={}

          expo = cfg.get('expo',{}) or {}

          # apply inputs
          def inp(k): return os.environ.get(k,'') or None

          if inp('APP_NAME'): expo['name']=inp('APP_NAME')
          if inp('APPLICATION_ID'):
            android = expo.get('android',{}) or {}
            android['package']=inp('APPLICATION_ID')
            expo['android']=android
          if inp('VERSION_NAME'): expo['version']=inp('VERSION_NAME')
          if inp('VERSION_CODE'):
            android = expo.get('android',{}) or {}
            try:
              android['versionCode']=int(inp('VERSION_CODE'))
            except:
              android['versionCode']=int(inp('VERSION_CODE') or 1)
            expo['android']=android
          if inp('ICON_URL'): expo['icon']=inp('ICON_URL')
          if inp('SPLASH_URL'):
            splash = expo.get('splash',{}) or {}
            splash['image']=inp('SPLASH_URL')
            expo['splash']=splash

          cfg['expo']=expo

          with open(p,'w') as f:
            json.dump(cfg,f,indent=2)
          print("Patched app.json at",p)
          PY2

      - name: Run EAS build
        run: npx eas-cli@latest build --platform android --profile production --non-interactive

      - name: (Optional) Download build artifact & Upload to S3 (non-fatal)
        if: env.UPLOAD_TO_S3 == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          set -e
          # find last finished build id (best-effort)
          BUILD_ID=$(npx eas-cli@latest build:list --platform android --limit 1 --status finished --json | jq -r '.[0].id' || true)
          if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" = "null" ]; then
            echo "No finished builds found; skipping S3 upload."
            exit 0
          fi
          echo "Found build id: $BUILD_ID"
          ARTIFACT_URL=$(npx eas-cli@latest build:view $BUILD_ID --json | jq -r '.artifacts.buildUrl // empty' || true)
          if [ -z "$ARTIFACT_URL" ]; then
            echo "No artifact URL found for build $BUILD_ID; skipping S3 upload."
            exit 0
          fi
          echo "Downloading artifact from: $ARTIFACT_URL"
          curl -fL -o app.aab "$ARTIFACT_URL" || { echo "Download failed; skipping S3 upload."; exit 0; }
          echo "Uploading to s3..."
          aws configure set region "$AWS_REGION"
          aws s3 cp app.aab "s3://$S3_BUCKET/expo-artifacts/$GITHUB_RUN_ID-app.aab" || echo "S3 upload failed (non-fatal)."
        continue-on-error: true
