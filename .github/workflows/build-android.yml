name: Build Android App

on:
  workflow_dispatch:
    inputs:
      appName:
        description: 'App Name'
        required: true
        default: 'My Expo App'
      webUrl:
        description: 'Web URL'
        required: true
        default: 'https://expo.dev'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Build Android App
        run: eas build -p android --profile production --non-interactive
        env:
          APP_NAME: ${{ github.event.inputs.appName }}
          WEB_URL: ${{ github.event.inputs.webUrl }}
